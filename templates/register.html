<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - JobPortal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="form-container">
        <div class="logo" style="text-align: center; margin-bottom: 2rem;">JobPortal</div>
        <h2 style="text-align: center; margin-bottom: 1.5rem;">Create Account</h2>
        
        <form method="POST">
            <div class="role-selector" id="roleSelector">
                <div class="role-option" data-role="jobseeker">
                    <i class="fas fa-user-graduate"></i>
                    <span>Job Seeker</span>
                </div>
                <div class="role-option" data-role="employer">
                    <i class="fas fa-building"></i>
                    <span>Employer</span>
                </div>
                <div class="role-option" data-role="admin">
                    <i class="fas fa-user-shield"></i>
                    <span>Admin</span>
                </div>
            </div>
            <input type="hidden" name="role" id="roleInput" value="jobseeker">
            
            <div class="form-group">
                <input type="text" name="username" placeholder="Username" required>
            </div>
            <div class="form-group">
                <input type="email" name="email" placeholder="Email" required>
            </div>
            <div class="form-group">
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Register</button>
        </form>
        
        <div style="text-align: center; margin-top: 1.5rem; color: #6b7280;">
            Already have an account? <a href="{{ url_for('login') }}" style="color: #667eea; text-decoration: none;">Login</a>
        </div>
    </div>

    <script>
        const options = document.querySelectorAll('.role-option');
        const roleInput = document.getElementById('roleInput');
        
        options.forEach(opt => {
            opt.addEventListener('click', () => {
                options.forEach(o => o.classList.remove('selected'));
                opt.classList.add('selected');
                roleInput.value = opt.dataset.role;
            });
        });
    </script>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash-message flash-{{ category }}">{{ message }}</div>
                <script>
                    setTimeout(() => {
                        document.querySelector('.flash-message')?.remove();
                    }, 3000);
                </script>
            {% endfor %}
        {% endif %}
    {% endwith %}
</body>
</html>

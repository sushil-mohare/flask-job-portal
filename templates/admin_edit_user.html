<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="sidebar">
        <div class="logo">JobPortal Admin</div>
        <nav>
            <a href="{{ url_for('dashboard') }}" class="nav-item"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a href="{{ url_for('admin_users') }}" class="nav-item active"><i class="fas fa-users"></i> Manage Users</a>
            <a href="{{ url_for('logout') }}" class="nav-item"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="header">
            <div class="welcome">Edit User</div>
            <a href="{{ url_for('logout') }}" class="btn-danger">Logout</a>
        </div>

        <div class="card" style="max-width: 600px;">
            <form method="POST">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" value="{{ user.username }}" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" value="{{ user.email }}" required>
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select name="role">
                        <option value="jobseeker" {% if user.role == 'jobseeker' %}selected{% endif %}>Job Seeker</option>
                        <option value="employer" {% if user.role == 'employer' %}selected{% endif %}>Employer</option>
                        <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Admin</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Update User</button>
                <a href="{{ url_for('admin_users') }}" style="margin-left: 1rem; color: #6b7280; text-decoration: none;">Cancel</a>
            </form>
        </div>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash-message flash-{{ category }}">{{ message }}</div>
                <script>setTimeout(() => { document.querySelector('.flash-message')?.remove(); }, 3000);</script>
            {% endfor %}
        {% endif %}
    {% endwith %}
</body>
</html>
